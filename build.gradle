plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'java'
}

group = 'com.finicalfirecooldown'
version = '0.1.0'

base {
    archivesName = 'Finicalfirecooldown'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://jitpack.io' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.1+1.20.1"

    // Optional optimization mods referenced for compatibility
    modCompileOnly "maven.modrinth:sodium:mc1.20.1-0.5.11"
    modCompileOnly "maven.modrinth:lithium:mc1.20.1-0.11.1"

    // Client command API for benchmarking overlay toggles
    modImplementation "net.fabricmc.fabric-api:fabric-command-api-v2:0.92.1+1.20.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

loom {
    splitEnvironmentSourceSets()
}

processResources {
    inputs.property "version", project.version
    filteringCharset = 'UTF-8'
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
